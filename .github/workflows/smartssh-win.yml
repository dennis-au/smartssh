name: smartssh-win
on:
  # Two ways in: an operator-chosen manual run, and a version tag push (v*), which builds
  # the portable exe and opens a DRAFT release for a human to publish. A plain branch push
  # still never spends runner minutes.
  workflow_dispatch:
  push:
    tags:
      - 'v*'
concurrency:
  group: smartssh-win-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
env:
  SMARTSSH_VERSION: "1.0.238"
jobs:
  portable:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
      - name: Install deps
        id: install
        run: |
          npm i -g yarn
          cd app
          yarn --network-timeout 1000000
          cd ..
          yarn --network-timeout 1000000
      - name: Core tests (every SmartSSH test file, single entry point)
        id: tests
        run: node smartssh/verify/test-all.mjs
      - name: Webpack build
        id: webpack
        run: yarn run build
      - name: Build info
        id: buildinfo
        shell: powershell
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          $info = [ordered]@{
            base    = "$env:SMARTSSH_VERSION"
            build   = "sms.${{ github.run_number }}"
            commit  = $sha
            builtAt = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          }
          New-Item -ItemType Directory -Force -Path extras | Out-Null
          # PS 5.1 "Out-File -Encoding utf8" writes a BOM; JSON.parse then throws and the app
          # falls back to "dev". Write UTF-8 without BOM explicitly.
          [IO.File]::WriteAllText((Join-Path $PWD "extras/smartssh-buildinfo.json"), ($info | ConvertTo-Json), (New-Object Text.UTF8Encoding($false)))
          Get-Content extras/smartssh-buildinfo.json
      - name: Portable exe
        id: portable
        run: node scripts/build-smartssh.mjs
      - name: Hash + version
        id: hash
        shell: powershell
        run: |
          $lines = @()
          Get-ChildItem dist -Filter *portable*.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            $lines += "$($_.Name)  $h"
            Write-Host $_.Name $h
          }
          [IO.File]::WriteAllLines((Join-Path $PWD "artifact-sha256.txt"), $lines, (New-Object Text.UTF8Encoding($false)))
          Get-Content artifact-sha256.txt
      - name: Publish status (credential-free read channel for the build agent)
        if: always()
        shell: powershell
        env:
          JOB_STATUS: ${{ job.status }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          S_INSTALL: ${{ steps.install.outcome }}
          S_TESTS: ${{ steps.tests.outcome }}
          S_WEBPACK: ${{ steps.webpack.outcome }}
          S_BUILDINFO: ${{ steps.buildinfo.outcome }}
          S_PORTABLE: ${{ steps.portable.outcome }}
          S_HASH: ${{ steps.hash.outcome }}
        run: |
          $hash = ''
          if (Test-Path artifact-sha256.txt) {
            $hash = (Get-Content artifact-sha256.txt -Raw).Trim() -replace "`r|`n", ' | '
          }
          $exe = ''
          Get-ChildItem dist -Filter *portable*.exe -ErrorAction SilentlyContinue | ForEach-Object {
            $exe = "$($_.Name) $([math]::Round($_.Length/1MB,1))MB"
          }
          # Public repo: this file is world-readable. Identity + the six step outcomes only —
          # no runner name, no OS build number, no paths, no timestamps.
          $out = [ordered]@{
            run      = [int]$env:RUN_NUMBER
            commit   = $env:SHA
            status   = $env:JOB_STATUS
            steps    = [ordered]@{
              install   = $env:S_INSTALL
              tests     = $env:S_TESTS
              webpack   = $env:S_WEBPACK
              buildinfo = $env:S_BUILDINFO
              portable  = $env:S_PORTABLE
              hash      = $env:S_HASH
            }
            sha256   = $hash
            exe      = $exe
          }
          New-Item -ItemType Directory -Force -Path ci-status | Out-Null
          [IO.File]::WriteAllText((Join-Path $PWD "ci-status/$($env:RUN_NUMBER).json"), ($out | ConvertTo-Json -Depth 3), (New-Object Text.UTF8Encoding($false)))
          Get-Content "ci-status/$($env:RUN_NUMBER).json"
      - name: Commit status
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add ci-status
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "ci: run ${{ github.run_number }} [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin smartssh && git push origin HEAD:smartssh; then
              echo "status pushed on attempt $attempt"; exit 0
            fi
            echo "push attempt $attempt rejected (non-fast-forward), retrying"
            sleep 5
          done
          echo "status push failed after 3 attempts"; exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smartssh-portable
          path: |
            dist/*portable*.exe
            artifact-sha256.txt
            extras/smartssh-buildinfo.json
          retention-days: 90
          if-no-files-found: ignore
      # Tag pushes only, and only when the build actually produced an exe. Draft, never public:
      # a human decides when a release goes live.
      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # PowerShell does not glob arguments for native commands, so resolve the exe here.
          $exe = Get-ChildItem dist -Filter *portable*.exe | Select-Object -First 1
          if (-not $exe) { throw "no *portable*.exe in dist; refusing to open an empty release" }
          $sha = "$env:GITHUB_SHA".Substring(0, 7)
          gh release create "$env:GITHUB_REF_NAME" --draft --title "$env:GITHUB_REF_NAME" --notes "portable exe built from $sha ($env:GITHUB_SHA)" $exe.FullName artifact-sha256.txt
          gh release view "$env:GITHUB_REF_NAME" --json isDraft,url

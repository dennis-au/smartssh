name: smartssh-win
on:
  push:
    branches: [smartssh]
    paths-ignore:
      - 'ci-status/**'
  workflow_dispatch:
permissions:
  contents: write
env:
  SMARTSSH_VERSION: "1.0.238"
jobs:
  portable:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
      - name: Install deps
        run: |
          npm i -g yarn
          cd app
          yarn --network-timeout 1000000
          cd ..
          yarn --network-timeout 1000000
      - name: Core tests (pure, no xterm dependency)
        run: |
          node smartssh/core/selftest.mjs
          node smartssh/core/diag.test.mjs
      - name: Webpack build
        run: yarn run build
      - name: Build info
        shell: powershell
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          $info = [ordered]@{
            base    = "$env:SMARTSSH_VERSION"
            build   = "sms.${{ github.run_number }}"
            commit  = $sha
            builtAt = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          }
          New-Item -ItemType Directory -Force -Path extras | Out-Null
          $info | ConvertTo-Json | Out-File -Encoding utf8 extras/smartssh-buildinfo.json
          Get-Content extras/smartssh-buildinfo.json
      - name: Portable exe
        run: node scripts/build-smartssh.mjs
      - name: Hash + version
        shell: powershell
        run: |
          Get-ChildItem dist -Filter *portable*.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$($_.Name)  $h" | Out-File -Append artifact-sha256.txt
            Write-Host $_.Name $h
          }
          Get-Content artifact-sha256.txt
      - name: Publish status (credential-free read channel for the build agent)
        if: always()
        shell: powershell
        env:
          JOB_STATUS: ${{ job.status }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          $hash = ''
          if (Test-Path artifact-sha256.txt) {
            $hash = (Get-Content artifact-sha256.txt -Raw).Trim() -replace "`r|`n", ' | '
          }
          $exe = ''
          Get-ChildItem dist -Filter *portable*.exe -ErrorAction SilentlyContinue | ForEach-Object {
            $exe = "$($_.Name) $([math]::Round($_.Length/1MB,1))MB"
          }
          $out = [ordered]@{
            run      = [int]$env:RUN_NUMBER
            run_id   = $env:RUN_ID
            status   = $env:JOB_STATUS
            commit   = $env:SHA
            version  = $env:SMARTSSH_VERSION
            sha256   = $hash
            exe      = $exe
            at       = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          }
          New-Item -ItemType Directory -Force -Path ci-status | Out-Null
          $out | ConvertTo-Json | Out-File -Encoding utf8 "ci-status/$($env:RUN_NUMBER).json"
          Get-Content "ci-status/$($env:RUN_NUMBER).json"
      - name: Commit status
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add ci-status
          git diff --cached --quiet || git commit -m "ci: run ${{ github.run_number }} [skip ci]"
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smartssh-portable
          path: |
            dist/*portable*.exe
            artifact-sha256.txt
            extras/smartssh-buildinfo.json
          retention-days: 90

name: smartssh-win
on:
  # Three ways in:
  #  - workflow_dispatch: an operator-chosen manual run.
  #  - push of a version tag (v*): the full run — install, tests, webpack, buildinfo, the portable
  #    exe, and a DRAFT release a human decides to publish.
  #  - push to the `smartssh` branch: the cheap half only (install / tests / webpack / buildinfo).
  #    Three separate "Linux green, Windows red" breaks were each discovered by spending a whole tag
  #    (~20-30 min per build), so the branch push exists to fail *before* a tag is burned. It can
  #    never produce an exe or a release: the packaging steps below carry a tag-only `if:`, and the
  #    status commit this job writes back carries `[skip ci]`, so it does not re-trigger itself.
  workflow_dispatch:
  push:
    branches:
      - smartssh
    tags:
      - 'v*'
concurrency:
  group: smartssh-win-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
env:
  # The version is NOT set here: a tag push (v*) derives it in the "Resolve version" step below, so
  # the exe name and the About chip can never disagree with the tag that produced them. This is only
  # the fallback for a manual run. It stays semver-shaped on purpose ('-dev' pre-release): the build
  # tools reject a non-semver version, and BASE_RE in smartssh/core/buildinfo.mjs rejects it too, so
  # such a build shows "dev" in the UI — a dev build, never a fake release number.
  SMARTSSH_VERSION_FALLBACK: "0.0.0-dev"
jobs:
  portable:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
      - name: Resolve version
        id: version
        shell: bash
        env:
          # A manual run has no tag to read; it may name a version, else it gets the dev pre-release
          # above. (No dispatch input is declared, so in practice this stays empty.)
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          # Picked up by scripts/vars.mjs (exe name via artifactName) and by the buildinfo step
          # (base field, i.e. the About chip): one derivation, so they cannot disagree.
          if [ "${GITHUB_REF_TYPE:-}" = tag ]; then
            V="${GITHUB_REF_NAME#v}"
          elif [ -n "${INPUT_VERSION:-}" ]; then
            V="$INPUT_VERSION"
          else
            V="${SMARTSSH_VERSION_FALLBACK:-0.0.0-dev}"
          fi
          V="$(printf '%s' "$V" | tr -d '[:space:]')"
          case "$V" in
            ''|*[!0-9A-Za-z.+-]*) echo "::error::resolved version '$V' contains unexpected characters"; exit 1 ;;
          esac
          echo "SMARTSSH_VERSION=$V" >> "$GITHUB_ENV"
          echo "resolved SMARTSSH_VERSION=$V (ref_type=${GITHUB_REF_TYPE:-}, ref=${GITHUB_REF:-})"
      - name: Install deps
        id: install
        run: |
          npm i -g yarn
          cd app
          yarn --network-timeout 1000000
          cd ..
          yarn --network-timeout 1000000
      - name: Core tests (every SmartSSH test file, single entry point)
        id: tests
        run: node smartssh/verify/test-all.mjs
      - name: Webpack build
        id: webpack
        run: yarn run build
      - name: Build info
        id: buildinfo
        shell: powershell
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          $info = [ordered]@{
            base    = "$env:SMARTSSH_VERSION"
            build   = "sms.${{ github.run_number }}"
            commit  = $sha
            builtAt = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          }
          New-Item -ItemType Directory -Force -Path extras | Out-Null
          # PS 5.1 "Out-File -Encoding utf8" writes a BOM; JSON.parse then throws and the app
          # falls back to "dev". Write UTF-8 without BOM explicitly.
          [IO.File]::WriteAllText((Join-Path $PWD "extras/smartssh-buildinfo.json"), ($info | ConvertTo-Json), (New-Object Text.UTF8Encoding($false)))
          Get-Content extras/smartssh-buildinfo.json
      - name: Portable exe
        id: portable
        # Tag or manual run only. A push to the `smartssh` branch stops at the four gate steps above,
        # so it can never spend the 10+ minutes of packaging nor leave an exe behind; a manual
        # dispatch keeps producing the dev exe it always did (SMARTSSH_VERSION_FALLBACK above).
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          # Staging lives in this step on purpose. `electron-builder.yml` declares
          # `extraResources: builtin-plugins`, and electron-builder skips an extraResources directory
          # that does not exist *silently* — that is how run 19 shipped an exe with no plugins at all
          # (no xterm, no smartssh bar, no metrics writer, so UI metrics was always SKIPPED). Keeping
          # the staging and both self-checks inside the packaging step means the exe cannot be
          # produced without them again, and the six published step outcomes stay the six they
          # always were.
          node scripts/prepackage-plugins.mjs
          node scripts/verify-packaging.mjs --stage=staged
          node scripts/build-smartssh.mjs
          node scripts/verify-packaging.mjs --stage=packaged
      - name: NSIS installer
        id: setup
        # Second Windows target from the same packaged tree: the assisted setup.exe. Same gate as the
        # portable exe — a tag or a manual run produces it, a push to `smartssh` never does (the
        # branch build exists to fail before a tag is burned, and must leave no exe behind).
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: powershell
        run: |
          # electron-builder.yml's `nsis:` block is the wizard/shortcut/uninstall contract; the
          # script only selects that target (oneClick stays false, so this can never become a silent
          # install). The portable exe produced above is untouched by this second build.
          node scripts/build-smartssh-installer.mjs
          if ($LASTEXITCODE -ne 0) { throw "build-smartssh-installer.mjs exited $LASTEXITCODE" }
          # A packaging step that silently produced nothing is the run-19 failure one target over:
          # fail here, with the reason, instead of letting an empty glob reach the status file.
          $setup = @(Get-ChildItem dist -Filter *setup*.exe -ErrorAction SilentlyContinue)
          if ($setup.Count -ne 1) { throw "expected exactly one dist/*setup*.exe, found $($setup.Count)" }
          # The name carries the SmartSSH identity the nsis block promises.
          if ($setup[0].Name -notmatch '^smartssh-.+-setup-.+\.exe$') { throw "unexpected setup exe name: $($setup[0].Name)" }
          Write-Host "$($setup[0].Name) $([math]::Round($setup[0].Length/1MB,1))MB"
      - name: Hash + version
        id: hash
        # Same condition as the step that produced `dist/`: tag or manual run, never a branch push.
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: powershell
        run: |
          # Two artifacts ship per build: the portable exe and the assisted installer. Both are
          # required — a build with only one of them is a failed packaging run, not a shorter one —
          # so each glob throws rather than writing an empty line into the published status.
          $lines = @()
          $artifacts = [ordered]@{}
          foreach ($spec in @(@('portable', '*portable*.exe'), @('setup', '*setup*.exe'))) {
            $kind = $spec[0]
            $files = @(Get-ChildItem dist -Filter $spec[1] -ErrorAction SilentlyContinue)
            if ($files.Count -ne 1) { throw "expected exactly one dist/$($spec[1]), found $($files.Count)" }
            $f = $files[0]
            $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash
            $lines += "$($f.Name)  $h"
            $artifacts[$kind] = [ordered]@{ name = $f.Name; sha256 = $h; bytes = $f.Length }
            Write-Host $kind $f.Name $h
          }
          [IO.File]::WriteAllLines((Join-Path $PWD "artifact-sha256.txt"), $lines, (New-Object Text.UTF8Encoding($false)))
          [IO.File]::WriteAllText((Join-Path $PWD "artifact-sha256.json"), ($artifacts | ConvertTo-Json -Depth 4), (New-Object Text.UTF8Encoding($false)))
          Get-Content artifact-sha256.txt
      - name: Publish status (credential-free read channel for the build agent)
        if: always()
        shell: powershell
        env:
          JOB_STATUS: ${{ job.status }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          S_INSTALL: ${{ steps.install.outcome }}
          S_TESTS: ${{ steps.tests.outcome }}
          S_WEBPACK: ${{ steps.webpack.outcome }}
          S_BUILDINFO: ${{ steps.buildinfo.outcome }}
          S_PORTABLE: ${{ steps.portable.outcome }}
          S_SETUP: ${{ steps.setup.outcome }}
          S_HASH: ${{ steps.hash.outcome }}
        run: |
          $hash = ''
          if (Test-Path artifact-sha256.txt) {
            # One line per artifact now (portable + setup), so join the lines instead of flattening
            # every CRLF into a separator, which produced " |  | " between the two entries.
            $hash = ((Get-Content artifact-sha256.txt) -join ' | ')
          }
          $exe = ''
          Get-ChildItem dist -Filter *portable*.exe -ErrorAction SilentlyContinue | ForEach-Object {
            $exe = "$($_.Name) $([math]::Round($_.Length/1MB,1))MB"
          }
          # A step's stdout is not carried between steps, so when `tests` failed the only way this
          # credential-free file can name the failing test file is to re-run the single entry point
          # here and publish its tail. --json keeps the payload on stdout (progress goes to stderr).
          # Never let this probe change the job's own outcome: exit code is reset, errors continue.
          $testsOutput = ''
          if ($env:S_TESTS -eq 'failure') {
            $ErrorActionPreference = 'Continue'
            $raw = (& node smartssh/verify/test-all.mjs --json 2>&1 | Out-String)
            if ($null -ne $raw) {
              $raw = $raw.Trim()
              if ($raw.Length -gt 4000) { $raw = $raw.Substring($raw.Length - 4000) }
              $testsOutput = $raw
            }
            $global:LASTEXITCODE = 0
          }
          # Public repo: this file is world-readable. Identity + the six step outcomes only —
          # no runner name, no OS build number, no paths, no timestamps. testsOutput is emitted only
          # on a failing run, and it is the runner's own test-all output (repo-relative file names).
          # Packaging evidence: written by scripts/verify-packaging.mjs inside the portable step. Counts
          # and repo-relative names only (no runner name, no path, no timestamp), and it is the only
          # way a verifier without a token can see whether the exe really carries builtin-plugins.
          $packaging = $null
          if (Test-Path packaging-report.json) {
            try { $packaging = (Get-Content packaging-report.json -Raw).Trim() | ConvertFrom-Json } catch { $packaging = $null }
          }
          # The two published artifacts as {portable:{name,sha256}, setup:{name,sha256}}. The hash
          # step wrote this file and throws when either exe is missing, so both being absent can only
          # mean that step never ran (branch push) — `steps.hash` tells a reader which it was.
          $artifacts = $null
          if (Test-Path artifact-sha256.json) {
            try { $artifacts = (Get-Content artifact-sha256.json -Raw).Trim() | ConvertFrom-Json } catch { $artifacts = $null }
          }
          $out = [ordered]@{
            run      = [int]$env:RUN_NUMBER
            commit   = $env:SHA
            status   = $env:JOB_STATUS
            steps    = [ordered]@{
              install   = $env:S_INSTALL
              tests     = $env:S_TESTS
              webpack   = $env:S_WEBPACK
              buildinfo = $env:S_BUILDINFO
              portable  = $env:S_PORTABLE
              setup     = $env:S_SETUP
              hash      = $env:S_HASH
            }
            sha256   = $hash
            exe      = $exe
          }
          if ($testsOutput) { $out['testsOutput'] = $testsOutput }
          if ($packaging) { $out['packaging'] = $packaging }
          if ($artifacts) { $out['artifacts'] = $artifacts }
          New-Item -ItemType Directory -Force -Path ci-status | Out-Null
          [IO.File]::WriteAllText((Join-Path $PWD "ci-status/$($env:RUN_NUMBER).json"), ($out | ConvertTo-Json -Depth 6), (New-Object Text.UTF8Encoding($false)))
          Get-Content "ci-status/$($env:RUN_NUMBER).json"
      - name: Commit status
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add ci-status
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "ci: run ${{ github.run_number }} [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin smartssh && git push origin HEAD:smartssh; then
              echo "status pushed on attempt $attempt"; exit 0
            fi
            echo "push attempt $attempt rejected (non-fast-forward), retrying"
            sleep 5
          done
          echo "status push failed after 3 attempts"; exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smartssh-win-exes
          path: |
            dist/*portable*.exe
            dist/*setup*.exe
            artifact-sha256.txt
            artifact-sha256.json
            extras/smartssh-buildinfo.json
            packaging-report.json
          retention-days: 90
          if-no-files-found: ignore
      # Tag pushes only, and only when the build actually produced both exes. Draft, never public:
      # a human decides when a release goes live.
      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # PowerShell does not glob arguments for native commands, so resolve the exes here.
          $portable = Get-ChildItem dist -Filter *portable*.exe | Select-Object -First 1
          if (-not $portable) { throw "no *portable*.exe in dist; refusing to open a release without the portable build" }
          $setup = Get-ChildItem dist -Filter *setup*.exe | Select-Object -First 1
          if (-not $setup) { throw "no *setup*.exe in dist; refusing to open a release without the installer" }
          $sha = "$env:GITHUB_SHA".Substring(0, 7)
          gh release create "$env:GITHUB_REF_NAME" --draft --title "$env:GITHUB_REF_NAME" --notes "portable exe + assisted NSIS installer, built from $sha ($env:GITHUB_SHA)" $portable.FullName $setup.FullName artifact-sha256.txt
          gh release view "$env:GITHUB_REF_NAME" --json isDraft,url

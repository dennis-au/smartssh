---
appId: org.tabby
productName: Tabby
compression: normal
npmRebuild: false
protocols:
  - name: Tabby URL
    schemes:
      - tabby
files:
- '**/*'
- dist
- '!lib'
- '!src'
- '!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme,node.lib}'
- '!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples,docs}'
- '!**/node_modules/@angular/common/locales'
- '!**/node_modules/@angular/compiler/src'
- '!**/node_modules/node-gyp'
- '!**/node_modules/**/*.d.ts'
- '!**/node_modules/**/*.map'
- '!**/node_modules/**/include/node'
- '!**/node_modules/.bin'
- '!**/node_modules/*/*/{esm5,fesm5,esm2015,fesm2015,_esm2015,_fesm2015}'
- '!**/node_modules/**/Release/obj'
- '!**/node_modules/**/*.{exp,iobj,ipdb,lib}'
- '!**/node_modules/**/*.vcxproj*'
- '!**/*.{woff,ttf,otf,eot}'
- '!**/*.{iml,o,hprof,orig,pyc,pyo,rbc,swp,csproj,sln,xproj}'
- '!.editorconfig'
- '!**/._*'
- '!**/{.DS_Store,.git,.hg,.svn,CVS,RCS,SCCS,.gitignore,.gitattributes}'
- '!**/{__pycache__,thumbs.db,.flowconfig,.idea,.vs,.nyc_output}'
- '!**/{appveyor.yml,.travis.yml,circle.yml}'
- '!**/{npm-debug.log,yarn.lock,.yarn-integrity,.yarn-metadata.json}'
- '!**/deps/cpu_features/build'
- '!**/node_modules/node-pty/third_party'
- '!**/node_modules/node-pty/prebuilds/*/conpty'
extraResources:
- builtin-plugins
- extras
asarUnpack:
- 'dist/*.map'
- node_modules/keytar/build/Release/*.node
- node_modules/**/*.node
- node_modules/node-pty/build/Release/conpty/*
win:
  icon: "./build/windows/icon.ico"
  # Both Windows targets are declared here, but each build script selects exactly one
  # (scripts/build-smartssh.mjs -> portable, scripts/build-smartssh-installer.mjs -> nsis), so a
  # portable build never grows an installer by accident and vice versa.
  target:
  - target: portable
    arch: [x64]
  - target: nsis
    arch: [x64]
  artifactName: tabby-${version}-portable-${env.ARCH}.${ext}
  signtoolOptions:
    rfc3161TimeStampServer: http://timestamp.sectigo.com
  # OpenConsole.exe is already signed by Microsoft
  signExts:
  - '!OpenConsole.exe'
nsis:
  # Assisted installer: the user sees the wizard and picks the directory. Never oneClick (no silent
  # install), never perMachine (no admin elevation just to install a terminal).
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # Start Menu + desktop shortcuts, and the Control Panel "Apps & features" uninstall entry that
  # every NSIS target gets by default. shortcutName names all of them.
  createStartMenuShortcut: true
  createDesktopShortcut: true
  shortcutName: Smart SSH
  runAfterFinish: true
  # Uninstall removes the per-user data too, so "uninstall leaves nothing behind" is literally true.
  # The portable build keeps its data next to the exe (<portable>/data), so the two never collide.
  deleteAppDataOnUninstall: true
  uninstallDisplayName: Smart SSH ${version}
  artifactName: smartssh-${version}-setup-${env.ARCH}.${ext}
  installerIcon: "./build/windows/icon.ico"
  uninstallerIcon: "./build/windows/icon.ico"
mac:
  category: public.app-category.utilities
  icon: "./build/mac/icon.icns"
  artifactName: tabby-${version}-macos-${env.ARCH}.${ext}
  hardenedRuntime: true
  entitlements: "./build/mac/entitlements.plist"
  entitlementsInherit: "./build/mac/entitlements.plist"
  extendInfo:
    ElectronTeamID: ${teamId}
    NSRequiresAquaSystemAppearance: false
    NSCameraUsageDescription: "A subprocess requests access to the device's camera."
    NSMicrophoneUsageDescription: "A subprocess requests access to the device's microphone."
    NSLocationUsageDescription: "A subprocess requests access to the user's location information."
    NSDesktopFolderUsageDescription: "A subprocess requests access to the user's Desktop folder."
    NSDocumentsFolderUsageDescription: "A subprocess requests access to the user's Documents folder."
    NSDownloadsFolderUsageDescription: "A subprocess requests access to the user's Downloads folder."
    NSNetworkVolumesUsageDescription: 'A subprocess requests access to files on a network volume.'
    NSRemovableVolumesUsageDescription: 'A subprocess requests access to files on a removable volume.'
    NSAppleEventsUsageDescription: 'A subprocess requests permission to send AppleScript events to another application.'

linux:
  category: "Utility;TerminalEmulator;System"
  icon: "./build/icons"
  artifactName: tabby-${version}-linux-${env.ARCH}.${ext}
  executableArgs:
  - "--no-sandbox"
  desktop:
    entry:
      StartupWMClass: tabby
      MimeType: x-scheme-handler/tabby
snap:
  plugs:
  - default
  - system-files
  - system-observe
deb:
  depends:
  - gnome-keyring
  - libnotify4
  - libsecret-1-0
  - libxtst6
  - libnss3
  afterInstall: build/linux/after-install.tpl
  fpm:
  - '--replaces'
  - 'terminus-terminal'
pacman:
  depends:
  - gnome-keyring
  - libsecret
rpm:
  depends:
  - gnome-keyring
  fpm:
  - '--rpm-rpmbuild-define'
  - '_build_id_links none'
  - '--replaces'
  - 'terminus-terminal'
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
